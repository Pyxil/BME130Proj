name: Development task
description: A scoped piece of work for one team (used for the project board)
labels: ["type: task"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - "team: frontend"
        - "team: backend"
        - "team: speech"
        - "team: ai"
        - "team: qa-integration"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Tests added/updated
        - [ ] Docs updated
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12, #15"
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      options: ["S (< 1 day)", "M (1-3 days)", "L (3-5 days)", "XL (split it)"]
  - type: checkboxes
    id: contract
    attributes:
      label: Interfaces
      options:
        - label: Touches a shared contract (OpenAPI, AnalysisResult, FeedbackResponse, engine interface)
