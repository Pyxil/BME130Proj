name: Setup on Windows, macOS and Linux

# Follows the README on a fresh machine of each kind: `python scripts/dev.py setup`
# (virtualenv, reference voices, Node packages, database), then every test including the ones
# that need the voices, then a live check of the real backend and the Vite dev server.
# Runs when setup-related files change, weekly (new package releases or moved model files
# can break setup without any change here), and on demand.
on:
  pull_request:
    paths:
      - "scripts/dev.py"
      - "scripts/download_models.py"
      - "scripts/smoke_test.py"
      - "speech_analysis/signal_analysis/**"
      - "pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "backend/core/config.py"
      - ".env.example"
      - ".github/workflows/setup-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/dev.py"
      - "scripts/download_models.py"
      - "scripts/smoke_test.py"
      - "speech_analysis/signal_analysis/**"
      - "pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "backend/core/config.py"
      - ".env.example"
      - ".github/workflows/setup-smoke.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: dev.py setup on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: newer-python
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # A .venv left by a newer Python (an earlier run, or an editor) broke Windows setup once:
      # editdistance has no Windows builds for 3.13+. Setup must replace it.
      - name: Leave behind a .venv made with Python 3.13
        shell: bash
        run: '"${{ steps.newer-python.outputs.python-path }}" -m venv .venv'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup, exactly as documented
        run: python scripts/dev.py setup
      - name: .venv was replaced with Python 3.12
        shell: bash
        run: grep -E "^version(_info)? *= *3\.12\." .venv/pyvenv.cfg
      - name: All tests, including the speech models
        run: python scripts/dev.py test --models
      - name: Live check of the backend and dev server
        run: python scripts/dev.py smoke --expect-engine signal-analysis
      - name: Production build of the frontend
        working-directory: frontend
        run: npm run build
