[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-therapy-app"
version = "0.1.0"
description = "Pronunciation practice: FastAPI backend, phoneme-level speech analysis and grounded AI feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # speech_analysis
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "onnxruntime>=1.17",          # Piper neural TTS for reference audio
  "pydantic>=2.6",
  # backend
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
# Phoneme recognition model (default engine). CPU-only torch on Linux:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["torch>=2.2", "allosaurus>=1.0.2"]
# Experimental wav2vec2 phoneme engine (SA_ENGINE=wav2vec2)
wav2vec2 = ["torch>=2.2", "transformers>=4.40", "huggingface_hub>=0.22"]
# Claude-powered feedback (LLM_PROVIDER=anthropic)
llm = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "cmudict>=1.0"]

[tool.setuptools.packages.find]
include = ["backend*", "speech_analysis*", "ai_feedback*"]

[tool.setuptools.package-data]
"speech_analysis.calibration" = ["*.json"]
"ai_feedback.knowledge" = ["*.json"]
"ai_feedback.prompts" = ["*.md"]
"backend" = ["alembic.ini", "alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["speech_analysis/tests", "ai_feedback/tests", "backend/tests"]
markers = [
  "model: needs the Allosaurus phoneme model and Piper voices (python scripts/download_models.py)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP007", "B905"]
